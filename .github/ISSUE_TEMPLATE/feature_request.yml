name: Feature request
description: Suggest an improvement for ArchiGen
title: "[Feature] "
labels: [feature-request, needs-triage]
body:
  - type: input
    id: summary
    attributes:
      label: Feature summary
      placeholder: Describe the feature in one sentence
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What issue are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your ideal outcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional
