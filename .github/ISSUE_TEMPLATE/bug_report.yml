name: Bug report
description: Report a technical issue in ArchiGen
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this issue. Please provide complete details so we can reproduce it.

  - type: input
    id: summary
    attributes:
      label: Short summary
      placeholder: Briefly describe the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps in order.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any relevant errors.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, device, and app mode
      placeholder: Windows 11, Chrome 128, Desktop
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images/videos if available.
